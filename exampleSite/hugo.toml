theme = "hugo-tailwindcss-starter-theme"
locale = "en-us"
baseurl = "http://example.com/"
title = "Hugo Tailwindcss Starter"

author = "Dirk Olbrich"
copyright = "Copyright © 2019-2024, Dirk Olbrich, all rights reserved."

[params]
    name = "Hugo Tailwindcss Starter"
    description = "A simple bootstraped theme for Hugo, build with Tailwindcss."

    github_user = "dirkolbrich"
    github_repo = "https://github.com/dirkolbrich/hugo-tailwindcss-starter-theme"
    github_banner = true

    favicon = "favicon.ico"

# syntax highlight settings
[markup]
  [markup.highlight]
    style = "dracula"

[security]
  [security.node.permissions]
    # Theme (layouts, assets, node_modules) lives in the parent directory when developing with --themesDir=../..
    allowRead = [".."]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

# Tailwind CSS v4 setup with Hugo's css.TailwindCSS
# see https://gohugo.io/functions/css/tailwindcss/
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'